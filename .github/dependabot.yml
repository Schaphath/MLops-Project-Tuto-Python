# Dependabot ouvre automatiquement des PR quand une version plus récente existe.
version: 2
updates:
  # Actions GitHub utilisées dans les workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Images de base des Dockerfile
  - package-ecosystem: docker
    directories:
      - /Api
      - /Interface
    schedule:
      interval: weekly
