# Limite la taille des logs
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Aucun privilège Linux pour l'API et l'interface
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *logging
    image: postgres:16-alpine  
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data # Données conservées même si le conteneur est supprimé
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro  # Exécuté à la première création de la base 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - db-net  

  api:
    <<: [*logging, *hardening]
    build:
      context: .
      dockerfile: ./Api/Dockerfile
    image: oncoscan-api:${VERSION:-2.0.0}
    container_name: oncoscan-api
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MODEL_PATH: /app/Save_models/adaboost_pipeline.joblib
      MODEL_VERSION: ${VERSION:-2.0.0}   
      INFERENCE_LOG_DIR: /app/logs
      LOG_LEVEL: INFO
    volumes:
      - ./Save_models:/app/Save_models:ro # Modèle en lecture seule 
      - inference-logs:/app/logs # Logs d'inférence conservés 
    ports:
      - "127.0.0.1:8000:8000"  # L'interface passe par le réseau interne : http://api:8000
    networks:
      - internal-net   # L'API n'a pas besoin de la base de données

  interface:
    <<: [*logging, *hardening]
    build:
      context: .
      dockerfile: ./Interface/Dockerfile
    image: oncoscan-app:${VERSION:-2.0.0}
    container_name: oncoscan-app
    restart: unless-stopped
    environment:
      API_URL: http://api:8000/predict
      API_KEY: ${API_KEY:?API_KEY must be set}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB_USER: ${DB_USER:?DB_USER must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      APP_VERSION: ${VERSION:-2.0.0}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8501:8501"   # Seul point d'entrée public
    networks:
      - internal-net
      - db-net

volumes:
  pgdata:
  inference-logs:

networks:
  internal-net:
    driver: bridge # Réseau entre l'interface et l'API
  db-net:
    driver: bridge # Réseau BD 
    internal: true # Aucun accès public