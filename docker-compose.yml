services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - db-net

  api:
    build:
      context: .
      dockerfile: ./Api/Dockerfile
    image: oncoscan-api:${VERSION:-2.0.0}
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MODEL_PATH: /app/api/../Save_models/adaboost_pipeline.joblib
      LOG_LEVEL: INFO
    volumes:
      - ./Save_models:/app/Save_models:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - internal-net
      - db-net

  interface:
    build:
      context: .
      dockerfile: ./Interface/Dockerfile
    image: oncoscan-app:${VERSION:-2.0.0}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000/predict
      API_KEY: ${API_KEY:?API_KEY must be set}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB_USER: ${DB_USER:?DB_USER must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_PORT: "8501"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    networks:
      - internal-net
      - db-net

volumes:
  pgdata:

networks:
  internal-net:
    driver: bridge
  db-net:
    driver: bridge